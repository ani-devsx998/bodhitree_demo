<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodhiTree</title>
    <link rel="icon" type="image/png" href="images/bodhitree icon.png">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <div class="navbar">
            <img id="BodhiTreeIcon" src="images/bodhitree icon.png" alt="BodhiTreeIcon">
        
            <div class="navlinks">
                <p id="Student">STUDENT</p>
                <a id="MyCourses" href="https://jaguar.bodhi-tree.in/courseware/courseslist">My Courses</a>
                <a id="Explore" href="https://jaguar.bodhi-tree.in/courseware">Explore</a>
                <div class="dropdown">
                    <button class="dropbutton"> user@example.com</button>
                    <div class="drop-content">
                        <a id="Profile" href="https://jaguar.bodhi-tree.in/profile">Profile</a>
                        <a id="Logout" href="">Logout</a>
                    </div>
                </div>
            </div>
        </div>
        
        

    </header>
    <main>
        <h2 id="CourseName">Problem Solving Through C++</h2>
        <div class="Header">
            <a id="MultimediaBook" href="https://jaguar.bodhi-tree.in/courseware/course/34/content/multimedia/coursecontent">Multimedia Book</a>
            <a id="Labs" href="https://jaguar.bodhi-tree.in/courseware/course/34/content/labs">Labs</a>
            <a id="Schedule" href="https://jaguar.bodhi-tree.in/courseware/course/34/interactions/schedule">Schedule</a>
            <a id="Announcements" href="https://jaguar.bodhi-tree.in/courseware/course/34/interactions/announcements">Announcements</a>
            <a id="Interaction" href="https://jaguar.bodhi-tree.in/courseware/course/34/interactions/discussion-forum">Interaction</a>
            <a id="Performance" href="https://jaguar.bodhi-tree.in/courseware/course/34/performance/progress">Performance</a>
            <a id="AboutCourse" href="https://jaguar.bodhi-tree.in/courseware/course/34/content/about">About Course</a>
            <a id="ExtraPages" href="https://jaguar.bodhi-tree.in/courseware/course/34/pages/">Extra Pages</a>            
        </div>
        <div class="Performance">
            <div class="tabs">
                <h3>Overview</h3>
                <h3>In-Dept Analysis</h3>
                <h3>Notes</h3>
            </div>

            <div class="content">
                <h3 id="Marks">Marks</h3>
                <h3 id="Highest marks">Highest Marks</h3>
                <h3 id="Time Taken">Time Taken</h3>
                <h3 id="Leaderboard Rank">Leaderboard Rank</h3>
            </div>
            
        </div>

    </main>


</body>
</html>
